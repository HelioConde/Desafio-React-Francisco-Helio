name: Qualidade • React
on:
  push:
    branches: [main, feature/modernizacao-crud-design-qa]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - name: Análise estática
        run: npm run lint
      - name: Testes de validação
        run: npm run test:unit
      - name: Build Vite
        run: npm run build
      - name: Preparar navegador
        run: npx playwright install --with-deps chromium
      - name: Testes funcionais e responsivos
        run: npm run test:e2e
      - name: Evidências e resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots-playwright
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
